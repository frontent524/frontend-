<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kusanovas' School — Level Placement Test</title>
<style>
  :root{
    --green-dark:#0d3b2e;
    --green:#1f7a4d;
    --green-light:#e6f5ec;
    --purple:#6a3fa0;
    --purple-light:#f0e9f8;
    --ink:#1a2420;
    --muted:#6b7770;
    --card:#ffffff;
    --bg:#f4f6f5;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:24px 12px;
  }
  #app{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:28px;
    box-shadow:0 20px 60px rgba(13,59,46,0.15);
    overflow:hidden;
    min-height:640px;
    display:flex;
    flex-direction:column;
  }
  header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 20px;
    border-bottom:1px solid #eee;
  }
  header .logo-circle{
    width:38px;height:38px;border-radius:50%;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  header .logo-circle img{width:100%;height:100%;object-fit:cover;}
  header .school-name{font-weight:800;font-size:15px;line-height:1.1;}
  header .school-sub{font-size:10px;color:var(--muted);letter-spacing:.5px;}
  .screen{display:none;flex-direction:column;flex:1;padding:24px 22px 22px;}
  .screen.active{display:flex;}

  /* Welcome */
  .eyebrow{color:var(--green);font-style:italic;font-weight:600;margin-bottom:4px;}
  h1{font-size:26px;margin:0 0 4px;line-height:1.15;}
  h1 span{color:var(--purple);}
  .desc{color:var(--muted);font-size:14px;margin-bottom:22px;}
  .mascot{
    align-self:center;
    width:100%;max-width:260px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;
  }
  .mascot img{width:100%;height:auto;display:block;}
  input[type=text]{
    width:100%;padding:14px 16px;border-radius:14px;border:1px solid #ddd;
    font-size:14px;margin-bottom:14px;background:#fafafa;
  }
  .btn{
    border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;
    cursor:pointer;width:100%;color:#fff;
    background:linear-gradient(90deg,var(--green-dark),var(--green));
    box-shadow:0 8px 20px rgba(31,122,77,.3);
  }
  .btn.purple{background:linear-gradient(90deg,#4b2777,var(--purple));box-shadow:0 8px 20px rgba(106,63,160,.3);}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .btn-outline{
    border:1px solid #ddd;background:#fff;color:var(--ink);border-radius:14px;
    padding:15px;font-weight:700;font-size:15px;width:100%;cursor:pointer;
  }
  .stat-row{display:flex;justify-content:center;gap:16px;margin-top:18px;color:var(--muted);font-size:13px;}
  .stat-row b{display:block;color:var(--ink);font-size:15px;}

  /* Question */
  .progress-wrap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .bar-bg{height:8px;border-radius:6px;background:#eee;margin-bottom:24px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;transition:width .3s ease;}
  .bar-fill.grammar{background:linear-gradient(90deg,var(--green-dark),var(--green));}
  .bar-fill.vocab{background:linear-gradient(90deg,#4b2777,var(--purple));}
  .section-tag{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    margin-bottom:6px;
  }
  .section-tag.grammar{color:var(--green);}
  .section-tag.vocab{color:var(--purple);}
  .question-text{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:22px;min-height:60px;}
  .options{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
  .option{
    display:flex;align-items:center;gap:12px;
    border:1.5px solid #e3e3e3;border-radius:14px;padding:13px 14px;
    cursor:pointer;font-size:14px;background:#fff;transition:.15s;
  }
  .option:hover{border-color:#ccc;}
  .option .letter{
    width:26px;height:26px;border-radius:50%;border:1.5px solid #ccc;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    color:var(--muted);flex-shrink:0;
  }
  .option.selected.grammar{border-color:var(--green);background:var(--green-light);}
  .option.selected.grammar .letter{background:var(--green);border-color:var(--green);color:#fff;}
  .option.selected.vocab{border-color:var(--purple);background:var(--purple-light);}
  .option.selected.vocab .letter{background:var(--purple);border-color:var(--purple);color:#fff;}
  .nav-row{display:flex;gap:12px;margin-top:auto;}
  .nav-row .btn-outline{flex:1;}
  .nav-row .btn, .nav-row .btn.purple{flex:1;}
  .tip{
    margin-top:16px;background:#f7f7f7;border-radius:12px;padding:12px 14px;
    font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;
  }

  /* Result */
  .result-screen{
    align-items:center;text-align:center;justify-content:center;flex:1;
  }
  .result-icon{font-size:52px;margin-bottom:10px;}
  .result-title{font-size:22px;font-weight:800;margin-bottom:8px;}
  .result-desc{color:var(--muted);font-size:14px;margin-bottom:26px;line-height:1.5;}
  .tg-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    text-decoration:none;color:#fff;font-weight:700;font-size:15px;
    background:linear-gradient(90deg,#2AABEE,#229ED9);
    border-radius:14px;padding:16px;width:100%;box-shadow:0 10px 24px rgba(34,158,217,.35);
    margin-bottom:12px;
  }
  .small-note{font-size:11px;color:#aab; color:var(--muted); margin-top:6px;}
</style>
</head>
